name: probe
on: { push: { branches: [probe-tmp] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && node probe.mjs
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add shots && git commit -m "shots [skip ci]" && git push
