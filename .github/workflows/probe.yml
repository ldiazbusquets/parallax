name: probe
on: { push: { branches: [probe-tmp] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && node probe.cjs
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add shots && git commit -qm "shots" && git push -q
