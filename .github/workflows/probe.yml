name: probe
on: { push: { branches: [probe-tmp] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && mkdir -p shots && node probe.mjs
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add shots && git commit -m "shots [skip ci]" && git push
