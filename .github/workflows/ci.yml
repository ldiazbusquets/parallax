name: CI
on:
  push:
    branches-ignore: [flights, probe-tmp]   # flights holds data files only
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintel-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintel-project/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
