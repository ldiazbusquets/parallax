name: Deploy site
# Builds the website and refreshes its data snapshot about every 15 minutes.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fintel-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintel-project/package-lock.json
      - run: npm ci
      - name: Today
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Daily data (company files, 1-year/5-year price history) is rebuilt once a day; the cache carries it between runs.
      - uses: actions/cache@v4
        with:
          path: |
            fintel-project/public/snap/co
            fintel-project/public/snap/quotes-1y.json
            fintel-project/public/snap/quotes-5y.json
            fintel-project/public/snap/chart-_GSPC-max.json
            fintel-project/public/snap/brief.json
            fintel-project/public/snap/imf.json
            fintel-project/.cache
            fintel-project/public/snap/conews.json
            fintel-project/public/snap/ohlc
            fintel-project/public/snap/ratings.json
            fintel-project/public/snap/shorts.json
            fintel-project/public/snap/ecocal.json
            fintel-project/public/snap/yields.json
            fintel-project/public/snap/screener.json
            fintel-project/public/snap/funds.json
            fintel-project/public/snap/season.json
            fintel-project/public/snap/ports.json
          key: companies-${{ steps.day.outputs.d }}-${{ github.run_id }}
          restore-keys: |
            companies-${{ steps.day.outputs.d }}-
            companies-
      - name: Snapshot data
        run: npx vite-node scripts/snapshot.ts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COMPANIES_MAX_AGE_H: '20'
      - name: Build
        run: npx vite build --base=./  # relative paths: survives repo renames
        env:
          VITE_STATIC: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fintel-project/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
